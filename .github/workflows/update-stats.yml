name: 更新工作计量

# assets/stats-*.svg 和 assets/heat-*.svg 是生成好的静态文件，不会自己更新。
# 这个 workflow 每天重跑一次 tools/collect.py + tools/render.py 并提交回去。
#
# 脚本零依赖：只用 runner 自带的 python3，不装 pip 包、不装字体。
#
# 关于 GH_PAT：
#   默认用仓库自带的 GITHUB_TOKEN，只能统计到公开仓库。
#   想把私有记忆库的提交也算进去，加一个名为 GH_PAT 的 secret
#   （classic token，勾选 repo）。不加也能正常跑。

on:
  schedule:
    - cron: "17 21 * * *" # UTC 21:17，北京时间次日 05:17
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 看看用的是哪个 token
        env:
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "使用 GH_PAT，包含私有仓库"
          else
            echo "::notice::未配置 GH_PAT，只统计公开仓库"
          fi

      - name: 采集数据
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 tools/collect.py

      - name: 生成卡片
        run: python3 tools/render.py

      - name: 提交变化
        run: |
          git config user.name  "TypeRota"
          git config user.email "typerota@163.com"
          git add data/stats.json assets/stats-dark.svg assets/stats-light.svg assets/heat-dark.svg assets/heat-light.svg
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore: 更新工作计量"
            git push
          fi
